server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upstream is the backend's container name, not the compose service name.
    # This container also sits on the shared proxy_net, where other projects
    # have services called "backend" too; on 2026-11-26 this nginx started
    # before our backend and resolved "backend" to theirs, sending /api and
    # /webhook to the CRM and RS Roof backends. The container name is unique
    # on every network; docker-compose.yml gives the local backend the same
    # name as an alias.

    location /api/ {
        proxy_pass http://ai_chatbot_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook/ {
        proxy_pass http://ai_chatbot_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The transcript endpoints (task 37.1), gated by the same CONSOLE_TOKEN.
    # Proxied only since there was a token to check: before that, this rule's
    # absence was the whole of the protection on that data.
    location /console/history {
        proxy_pass http://ai_chatbot_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Closing the demo off (task 19.1). Found live rather than in a test: a POST
    # to a path that falls through to the SPA is answered 405 by nginx, so the
    # button was deployed and unreachable, exactly the way the note below
    # predicted. Every console route has to be named here as well as in
    # vite.config.ts, and backend/tests/test_console_routing.py now says so.
    location = /console/demo-summary {
        proxy_pass http://ai_chatbot_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Taking the conversation off the bot, and answering it by hand (task 20).
    # Two more names on the list, because the list is what this file is.
    location = /console/handover {
        proxy_pass http://ai_chatbot_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /console/reply {
        proxy_pass http://ai_chatbot_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The control arm (task 12.2). Without this rule it falls through to the SPA
    # below and the switch gets index.html back with a 200 on it -- a failure
    # that cannot happen locally, because vite proxies by its own list.
    location = /console/tools {
        proxy_pass http://ai_chatbot_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The failure drill (task 27.1), for the same reason as the switch above.
    location = /console/fault-drill {
        proxy_pass http://ai_chatbot_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Autoplay (task 29).
    location = /console/autoplay {
        proxy_pass http://ai_chatbot_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Named paths, never the whole /console/ prefix: /console itself is a page the
    # SPA renders below, and everything else under the prefix should keep falling
    # through rather than becoming backend surface. The stream is gated by
    # CONSOLE_TOKEN -- see backend/app/routers/console.py.
    location = /console/stream {
        proxy_pass http://ai_chatbot_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An SSE connection is idle by design between tool calls, and buffering
        # would hold the very events this screen exists to show.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
