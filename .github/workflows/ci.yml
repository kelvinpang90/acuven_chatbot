# CI: runs on every PR and every push to master. The job names (unit, frontend)
# must match .platform/project.yaml's required_status_checks and the branch
# protection's required checks on master.
#
# OpenClaw's Worker waits for this CI to be green before handing a run over for
# approval, so this is the gate: every check in .platform/commands.yaml runs
# here with the same arguments, and the checks the Worker sandbox cannot run
# (the frontend build) live only here.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a PR's older runs are cancelled; every master commit keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same as backend/Dockerfile's base image.
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # `python -m pytest`, not bare `pytest`: only the former puts backend/ on
      # sys.path, which the tests need to import `app`.
      - name: Unit tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same as frontend/Dockerfile's build stage.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # The same build the image runs (tsc -b && vite build).
      - name: Build
        run: npm run build
